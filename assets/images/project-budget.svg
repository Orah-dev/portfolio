  <rect x="290" y="130" width="12" height="12" rx="3" fill="#2A9D8F"/>
  <text x="312" y="141" fill="#FFFFFF" font-family="sans-serif" font-size="12">Textbooks &amp; Software (45%)</text>
  <text x="520" y="141" fill="#A8DADC" font-family="sans-serif" font-size="12" text-anchor="end">₦38,250</text>

