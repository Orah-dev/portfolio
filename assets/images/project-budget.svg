<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="projBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#projBg4)"/>
  <rect width="600" height="42" rx="16" fill="#0A161B"/>
  <circle cx="25" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="45" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="65" cy="21" r="6" fill="#27C93F"/>
  <text x="300" y="26" fill="#A8DADC" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Student Smart Budget &amp; Expense Manager</text>

  <!-- Donut Chart representation -->
  <g transform="translate(130, 195)">
