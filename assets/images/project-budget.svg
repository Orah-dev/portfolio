    <circle cx="0" cy="0" r="70" fill="none" stroke="#E9C46A" stroke-width="24" stroke-dasharray="90 350" stroke-dashoffset="200"/>
    <text x="0" y="-5" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">₦85,000</text>
