<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="projBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#134074"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#02C39A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#projBg1)"/>
  <!-- Window Header -->
  <rect width="600" height="42" rx="16" fill="#07172C"/>
  <circle cx="25" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="45" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="65" cy="21" r="6" fill="#27C93F"/>
  <text x="300" y="26" fill="#8DA9C4" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Student CGPA Calculator &amp; Academic Forecaster</text>
  
  <!-- Dashboard UI Content -->
  <!-- Stat Card 1 -->
  <rect x="40" y="65" width="160" height="90" rx="10" fill="#1D3557" stroke="#00A896" stroke-width="1.5"/>
  <text x="55" y="92" fill="#8DA9C4" font-family="sans-serif" font-size="12">Current Cumulative GPA</text>
  <text x="55" y="132" fill="#02C39A" font-family="sans-serif" font-size="32" font-weight="bold">4.82<tspan font-size="15" fill="#8DA9C4"> / 5.0</tspan></text>
  
  <!-- Stat Card 2 -->
  <rect x="220" y="65" width="160" height="90" rx="10" fill="#1D3557"/>
  <text x="235" y="92" fill="#8DA9C4" font-family="sans-serif" font-size="12">Total Credit Units</text>
  <text x="235" y="132" fill="#EE6C4D" font-family="sans-serif" font-size="32" font-weight="bold">42<tspan font-size="15" fill="#8DA9C4"> Units</tspan></text>
  
  <!-- Stat Card 3 -->
  <rect x="400" y="65" width="160" height="90" rx="10" fill="#1D3557"/>
  <text x="415" y="92" fill="#8DA9C4" font-family="sans-serif" font-size="12">Standing</text>
  <text x="415" y="132" fill="#FFD166" font-family="sans-serif" font-size="26" font-weight="bold">First Class</text>

  <!-- Grade breakdown bars -->
  <rect x="40" y="175" width="520" height="150" rx="10" fill="#102A43"/>
  <text x="60" y="205" fill="#EEF4F8" font-family="sans-serif" font-size="14" font-weight="bold">Semester Grade Trend</text>
  <!-- Bars -->
  <rect x="80" y="270" width="40" height="40" rx="4" fill="url(#tealGrad)"/>
  <text x="100" y="325" fill="#8DA9C4" font-family="sans-serif" font-size="11" text-anchor="middle">Year 1 S1</text>
  <text x="100" y="260" fill="#EEF4F8" font-family="sans-serif" font-size="11" text-anchor="middle">4.65</text>

  <rect x="180" y="250" width="40" height="60" rx="4" fill="url(#tealGrad)"/>
  <text x="200" y="325" fill="#8DA9C4" font-family="sans-serif" font-size="11" text-anchor="middle">Year 1 S2</text>
  <text x="200" y="240" fill="#EEF4F8" font-family="sans-serif" font-size="11" text-anchor="middle">4.78</text>

  <rect x="280" y="235" width="40" height="75" rx="4" fill="url(#tealGrad)"/>
  <text x="300" y="325" fill="#8DA9C4" font-family="sans-serif" font-size="11" text-anchor="middle">Year 2 S1</text>
  <text x="300" y="225" fill="#EEF4F8" font-family="sans-serif" font-size="11" text-anchor="middle">4.85</text>

  <rect x="380" y="220" width="40" height="90" rx="4" fill="#02C39A"/>
  <text x="400" y="325" fill="#8DA9C4" font-family="sans-serif" font-size="11" text-anchor="middle">Current</text>
  <text x="400" y="210" fill="#EEF4F8" font-family="sans-serif" font-size="11" text-anchor="middle">4.92</text>

  <!-- Interactive badge -->
  <rect x="445" y="240" width="100" height="34" rx="6" fill="#00A896"/>
  <text x="495" y="262" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+ Add Course</text>
</svg>